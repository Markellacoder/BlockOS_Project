name: BlockOS ISO Generator
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Rendszer eszkozok telepitese
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin grub-common mtools

      - name: ISO struktura felepitese
        run: |
          mkdir -p iso_root/boot/grub
          cp -r apps system desktop installer bootloader iso_root/
          
          # Kimasoljuk a szerver igazi kernelét, hogy ne legyen üres a fájl
          # Ez kb 10-15 MB lesz, de ettől lesz igazi az ISO
          cp /boot/vmlinuz-$(uname -r) iso_root/boot/vmlinuz
          
          # Letrehozunk egy minimalis RAM-diszket is, hogy ne álljon meg a boot
          cp /boot/initrd.img-$(uname -r) iso_root/boot/initrd.img

          # Profi GRUB konfiguráció
          cat <<EOF > iso_root/boot/grub/grub.cfg
          set timeout=5
          set default=0
          menuentry "BlockOS" {
              linux /boot/vmlinuz quiet splash
              initrd /boot/initrd.img
          }
          EOF

      - name: ISO gyartasa
        run: |
          grub-mkrescue -o BlockOS_Final.iso iso_root

      - name: ISO feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: BlockOS-Professional-ISO
          path: BlockOS_Final.iso
