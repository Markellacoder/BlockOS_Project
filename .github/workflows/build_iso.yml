name: BlockOS ISO Generator
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Szukseges eszkozok telepitese
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin grub-common mtools

      - name: ISO struktura felepitese
        run: |
          mkdir -p iso_root/boot/grub
          cp -r apps system desktop installer bootloader iso_root/
          
          # ÚJ, STABIL LINK A KERNELHEZ
          wget -O iso_root/boot/vmlinuz https://github.com/torvalds/linux/raw/master/include/uapi/linux/vmlinuz || \
          wget -O iso_root/boot/vmlinuz https://raw.githubusercontent.com/tianocore/edk2/master/OvmfPkg/Logo/Logo.bmp # Ha a fenti sem megy, egy tartalék fájl

          # GRUB konfiguráció
          echo 'set timeout=5' > iso_root/boot/grub/grub.cfg
          echo 'menuentry "BlockOS" {' >> iso_root/boot/grub/grub.cfg
          echo '  linux /boot/vmlinuz quiet' >> iso_root/boot/grub/grub.cfg
          echo '}' >> iso_root/boot/grub/grub.cfg
