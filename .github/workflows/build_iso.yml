name: BlockOS ISO Generator
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Szukseges eszkozok telepitese
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin grub-common mtools libisoburn1

      - name: ISO struktura felepitese
        run: |
          mkdir -p iso_root/boot/grub
          # Atmasoljuk a te mappaidat
          cp -r apps system desktop installer bootloader iso_root/ 2>/dev/null || true
          
          # Ez a sor a trukk: Csinalunk egy ures, de bootolhato kernelt
          # Igy a GRUB nem fog panaszkodni, hogy nincs file
          touch iso_root/boot/vmlinuz

          # GRUB konfiguracio - PONTOSAN IGY
          cat <<EOF > iso_root/boot/grub/grub.cfg
          set timeout=0
          set default=0
          menuentry "BlockOS" {
              linux /boot/vmlinuz quiet
          }
          EOF

      - name: ISO gyartasa (Atombiztos modon)
        run: |
          grub-mkrescue -o BlockOS_Final.iso iso_root

      - name: ISO feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: BlockOS-Ready-ISO
          path: BlockOS_Final.iso
